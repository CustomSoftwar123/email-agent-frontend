<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Corvo — logo options</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root { --indigo:#6366f1; --ink:#14142b; --faint:#6e6e91; --line:#e9eaf6; }
  * { box-sizing: border-box; }
  body { margin:0; padding:40px 24px 80px; background:#f4f5fb; color:var(--ink);
         font-family:Inter,system-ui,sans-serif; }
  .wrap { max-width:1080px; margin:0 auto; }
  h1 { font-size:26px; letter-spacing:-.02em; margin:0 0 6px; }
  .sub { color:var(--faint); font-size:14px; margin:0 0 32px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(320px,1fr)); gap:20px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:14px; padding:20px;
          box-shadow:0 4px 16px rgba(79,70,229,.06); }
  .num { display:inline-flex; align-items:center; justify-content:center; width:24px; height:24px;
         border-radius:7px; background:var(--indigo); color:#fff; font-size:12px; font-weight:700; }
  .name { font-weight:600; font-size:15px; margin-left:8px; }
  .desc { color:var(--faint); font-size:12.5px; margin:8px 0 18px; line-height:1.5; }
  .row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .tile { width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg,#6366f1,#8b5cf6);
          color:#fff; display:flex; align-items:center; justify-content:center; }
  .plain { color:var(--indigo); display:flex; align-items:center; }
  .dark { background:#0f1419; color:#fff; border-radius:10px; padding:9px 12px; display:flex;
          align-items:center; gap:9px; }
  .dark .wm { font-size:14px; font-weight:600; letter-spacing:-.01em; }
  .lockup { display:flex; align-items:center; gap:10px; margin-top:16px; padding-top:16px;
            border-top:1px solid var(--line); }
  .lockup .wm { font-size:17px; font-weight:600; letter-spacing:-.02em; }
  .lockup .kick { font-size:9.5px; font-weight:700; letter-spacing:.12em; color:var(--faint);
                  text-transform:uppercase; }
  .tiny { color:var(--faint); font-size:11px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Corvo — pick a logo</h1>
  <p class="sub">Each mark shown at 52px in a tile, 26px plain, and 16px in a dark bar — that small
     size is the real test. Reply with the number you want.</p>
  <div class="grid" id="grid"></div>
</div>

<script>
// Every mark is a 32×32 viewBox using currentColor, so it inherits its context.
const MARKS = {
  1: `<path d="M25.5 9.5 30 8l-3.2 3.6a9.7 9.7 0 0 1 .7 3.6c0 5.4-4.4 9.8-9.8 9.8-.7 0-1.4-.1-2-.2-.7-.2-1.5 0-2 .6l-2.4 2.6c-.5.6-1.5.3-1.7-.5l-.7-3.1c-.2-.8-.8-1.4-1.6-1.6l-3.1-.7c-.8-.2-1-1.2-.5-1.7l2.4-2.3c.6-.6.9-1.4.8-2.2v-.7C6.9 9.8 11.9 5 17.9 5c3 0 5.7 1.2 7.6 3.2Z" fill="currentColor"/>
        <circle cx="20.5" cy="13" r="1.7" fill="#fff" fill-opacity=".92"/>`,
  2: `<g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round">
        <path d="M24 7.5A11 11 0 1 0 24 24.5"/>
        <path d="M20.5 12.5a6 6 0 1 0 0 7"/>
      </g>`,
  3: `<g fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7 26 26 7"/>
        <path d="M24.5 8.5c1.5 6-1 12-6 14.5-3 1.5-6.5 1.5-9 0"/>
        <path d="M18 9.5 21 15M13.5 14 16.5 19.5M10 18.5 12.5 23"/>
      </g>`,
  4: `<g fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 18.5 11.5 11l6 5.5L26 8.5"/>
        <path d="M20.5 8.5H26v5.5"/>
      </g>`,
  5: `<path d="M4 24.5 16 6l12 18.5-12-6.5-12 6.5Z" fill="currentColor"/>`,
  6: `<g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M26 6c-9 1-14 6.5-16 12"/>
        <path d="M26 6c1 8.5-3 14-9.5 15.5"/>
        <path d="M10 18c-2.5 2.5-3.5 5.5-3.5 8.5"/>
      </g>`,
}

const META = {
  1: ['Raven head', 'A raven in profile with an open beak, one clear eye. The most literal reading of the name — unmistakably a bird at any size.'],
  2: ['Wing crescent C', 'Two nested arcs forming a C for Corvo, which also reads as a wing mid-beat. Purely geometric, so it stays crisp at 16px.'],
  3: ['Quill feather', 'A raven feather — the tool correspondence was written with. Ties the bird to the writing the agent does.'],
  4: ['Flight path', 'A message tracing a flight path with an arrow at the end. Reads as motion and delivery rather than as a bird.'],
  5: ['Wing solid', 'A single filled wing, folded. Bold and heavy — the strongest presence in a small tile.'],
  6: ['Feather sweep', 'Three tapered strokes suggesting a wing in motion. The lightest, most abstract of the six.'],
}

const svg = (n, size) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 32 32" aria-hidden="true">${MARKS[n]}</svg>`

document.getElementById('grid').innerHTML = Object.keys(MARKS).map((n) => `
  <div class="card">
    <div><span class="num">${n}</span><span class="name">${META[n][0]}</span></div>
    <p class="desc">${META[n][1]}</p>
    <div class="row">
      <div class="tile">${svg(n, 30)}</div>
      <div class="plain">${svg(n, 26)}</div>
      <div class="dark">${svg(n, 16)}<span class="wm">Corvo</span></div>
    </div>
    <div class="lockup">
      <div class="tile" style="width:44px;height:44px;border-radius:11px">${svg(n, 25)}</div>
      <div>
        <div class="wm">Corvo</div>
        <div class="kick">● AI email agent</div>
      </div>
    </div>
    <p class="tiny" style="margin:14px 0 0">52px · 26px · 16px · full lockup</p>
  </div>
`).join('')
</script>
</body>
</html>
